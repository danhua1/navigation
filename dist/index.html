    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="本地优先的个人网址导航，数据保存在浏览器中。" />
    <title>我的导航</title>
    <script>
      // 首屏绘制前套用主题，避免暗色模式用户先看到一帧白底
      (function () {
        try {
          var raw = localStorage.getItem('nav_site_data')
          var theme = raw && (JSON.parse(raw).settings || {}).theme
          if (theme !== 'light' && theme !== 'dark') {
            theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>

    <link rel="stylesheet" crossorigin href="/assets/index-CoTmIvTs.css">
  </head>

  </body>
